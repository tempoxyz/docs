name: Docs routing smoke

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      canonical_origin:
        description: Canonical Tempo origin to test
        required: true
        default: https://tempo.xyz
      legacy_origin:
        description: Legacy docs origin to test
        required: true
        default: https://docs.tempo.xyz

permissions: {}

jobs:
  smoke:
    name: Production redirect contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      DOCS_ROUTING_SMOKE_CANONICAL_ORIGIN: ${{ inputs.canonical_origin || 'https://tempo.xyz' }}
      DOCS_ROUTING_SMOKE_LEGACY_ORIGIN: ${{ inputs.legacy_origin || 'https://docs.tempo.xyz' }}
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          run_install: false
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployed routing
        run: pnpm test:routing:smoke
