name: Tempo MCP smoke

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      endpoint:
        description: Tempo MCP endpoint to test
        required: true
        default: https://mcp.tempo.xyz

permissions: {}

jobs:
  smoke:
    name: Production search and page read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TEMPO_MCP_SMOKE_ENDPOINT: ${{ inputs.endpoint || 'https://mcp.tempo.xyz' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.12.0

      - name: Verify deployed MCP
        run: node scripts/smoke-mcp.mjs
