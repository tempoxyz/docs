name: Verify
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

env:
  NODE_USE_SYSTEM_CA: 1

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    # Site builds are mostly single-threaded plugin work, so Depot's faster cores
    # roughly halve them. Set the DEPOT_DISABLED variable to fall back to GitHub.
    runs-on: ${{ startsWith(matrix.runner, 'depot-') && vars.DEPOT_DISABLED == 'true' && 'ubuntu-latest' || matrix.runner }}
    container: ${{ matrix.container }}
    # Site builds compile five Vite environments; keep headroom over the build.
    timeout-minutes: ${{ matrix.target == 'check' && 15 || 20 }}
    permissions:
      # E2E shards read the E2E Build artifact from this run.
      actions: read
      contents: read
      id-token: write
    # Report cheap failures early and cancel sibling builds/tests on failure.
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: check
            name: Check
            runner: ubuntu-latest
            shard: 0
            container: ''
          - target: production
            name: Sitemap
            runner: depot-ubuntu-latest-8
            shard: 0
            container: ''
          # One build serves every E2E shard. It runs in the shards' container so
          # absolute paths in the server output match where the shards serve it.
          - target: e2e-build
            name: E2E Build
            runner: depot-ubuntu-latest-8
            shard: 0
            container:
              image: mcr.microsoft.com/playwright:v1.61.1-noble
              options: --user 1001
          # Depot shares egress IPs, which exhaust Moderato's anonymous per-IP
          # connection limit. Live tests send Moderato RPC through the Tempo API
          # with TEMPO_RPC_API_KEY, which reaches the RPC as an authenticated client.
          - target: e2e
            name: E2E Tests (1/3)
            runner: depot-ubuntu-latest-8
            shard: 1
            container:
              image: mcr.microsoft.com/playwright:v1.61.1-noble
              options: --user 1001
          - target: e2e
            name: E2E Tests (2/3)
            runner: depot-ubuntu-latest-8
            shard: 2
            container:
              image: mcr.microsoft.com/playwright:v1.61.1-noble
              options: --user 1001
          - target: e2e
            name: E2E Tests (3/3)
            runner: depot-ubuntu-latest-8
            shard: 3
            container:
              image: mcr.microsoft.com/playwright:v1.61.1-noble
              options: --user 1001

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          # Container jobs cannot be hardened in-place and lack the GitHub CLI.
          disable-enforcement: ${{ startsWith(matrix.target, 'e2e') }}

      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          run_install: false
          version: 10.28.1

      # pnpm installs the exact Node runtime pinned in devEngines and the lockfile.
      # Reuse it instead of downloading a second copy through setup-node.
      - name: Locate pnpm store
        id: pnpm-store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "arch=$(node -p process.arch)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies and Node runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-${{ runner.os }}-${{ steps.pnpm-store.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          # A lockfile change still reuses every unchanged package in the store.
          restore-keys: |
            node-cache-${{ runner.os }}-${{ steps.pnpm-store.outputs.arch }}-pnpm-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec node --version
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Fail cheap source checks before testing or building.
      - name: Check
        if: matrix.target == 'check'
        run: pnpm run check

      - name: Check types
        if: matrix.target == 'check'
        run: pnpm run check:types

      - name: Check internal anchors
        if: matrix.target == 'check'
        run: pnpm run check:anchors

      - name: Check OG image goldens
        if: matrix.target == 'check'
        run: pnpm og:goldens:check

      - name: Upload OG image review gallery
        if: ${{ !cancelled() && matrix.target == 'check' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: og-image-goldens
          path: test-results/og-goldens/
          if-no-files-found: error
          retention-days: 15

      - name: Test
        if: matrix.target == 'check'
        run: pnpm run test --bail=1

      - name: Fetch OpenAPI specification
        if: matrix.target == 'production'
        run: |
          node --experimental-strip-types scripts/fetch-openapi.ts "$RUNNER_TEMP/openapi.json"
          echo "OPENAPI_SPEC_URL=$RUNNER_TEMP/openapi.json" >> "$GITHUB_ENV"

      # Vocs keys Twoslash snippets by content. Their type environment is the
      # installed packages, so key on the lockfile and patches; source edits
      # would otherwise miss on nearly every run. Bump v2 if Twoslash options change.
      # Graphite checks its own 24-hour TTL and route coverage before using cached links.
      - name: Cache documentation build inputs
        if: matrix.target == 'production' || matrix.target == 'e2e-build'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/.cache/vocs/twoslash
            node_modules/.cache/graphite-related-docs.json
          key: docs-inputs-${{ runner.os }}-v2-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.shard }}
          restore-keys: |
            docs-inputs-${{ runner.os }}-v2-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}-

      # The Check sibling validates types once; builds preserve the normal site pipeline.
      - name: Build
        if: matrix.target == 'production'
        run: node scripts/guard-vocs-config.mjs && pnpm run build:site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          VERCEL: "1"
          VERCEL_ENV: production

      - name: Check sitemap coverage
        if: matrix.target == 'production'
        run: node --experimental-strip-types scripts/check-vercel-sitemap.ts

      - name: Check generated public links
        if: matrix.target == 'production'
        run: node scripts/check-generated-public-links.mjs

      - name: Audit generated Markdown
        if: matrix.target == 'production'
        run: pnpm run check:markdown

      - name: Build app for E2E
        if: matrix.target == 'e2e-build'
        run: node scripts/guard-vocs-config.mjs && pnpm run build:site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_E2E: "true"
          VITE_USE_HTTP: "true"

      - name: Upload app for E2E
        if: matrix.target == 'e2e-build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-dist-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          # Shards wait on this upload; speed matters more than size.
          compression-level: 1

      - name: Wait for app build
        id: e2e-build
        if: matrix.target == 'e2e'
        run: node scripts/wait-for-e2e-build.mjs "E2E Build" e2e-dist
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download app for E2E
        if: matrix.target == 'e2e'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.e2e-build.outputs.name }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Run Playwright tests
        if: matrix.target == 'e2e'
        run: |
          pnpm exec playwright test --list --reporter=./scripts/playwright-shard-reporter.ts > "$RUNNER_TEMP/e2e-tests.txt"
          test -s "$RUNNER_TEMP/e2e-tests.txt"
          pnpm run test:e2e --workers=6 --test-list "$RUNNER_TEMP/e2e-tests.txt"
        env:
          E2E_SHARD: ${{ matrix.shard }}
          E2E_SHARDS: 3
          TEMPO_RPC_API_KEY: ${{ secrets.TEMPO_RPC_API_KEY }}

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && matrix.target == 'e2e' }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 15
  ci-gate:
    name: CI Gate
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Verify required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs failed, were cancelled, or were skipped"
            exit 1
          fi
