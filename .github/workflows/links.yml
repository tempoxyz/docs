name: External Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly link-rot check, independent of code changes.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: links-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Lychee
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0

      - name: Restore lychee cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Run lychee
        uses: tempoxyz/gh-actions/vendor/lycheeverse/lychee-action@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          # README.md is a GitHub-only artifact with pre-existing
          # broken references (LICENSE files, lockup paths); excluded
          # from this check. Docs site content lives in src/pages/.
          args: >-
            --preprocess scripts/filter-external-links.ts
            'src/pages/**/*.md'
            'src/pages/**/*.mdx'
            'vocs.config.ts'
          fail: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Broken external links detected" --body-file lychee/out.md --label docs --label links
