<g transform="translate(480 197)" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<circle r="23"/>
<path d="M-11 0l8 8 16-17"/>
</g>
<text x="480" y="254" font-size="22" font-weight="600" text-anchor="middle" fill="currentColor">Batch settlement</text>
<text x="480" y="296" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Submit the commitments</text>
<text x="480" y="322" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Tempo accepts the batch</text>
