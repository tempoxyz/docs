<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 88 960 404" fill="none" font-family="Pilat, ui-sans-serif, system-ui, sans-serif" style="color: var(--foreground, #111)">
<title>Zone prover: prepare, prove, settle</title>
<desc>The Zone sequencer groups blocks into a batch and gathers the state witness. The Nitro prover replays the batch in AWS Nitro and signs an attestation. On Tempo, the Zone portal verifies quorum signatures and the attestation, then records state and queues withdrawals. In T13, NoProof lets quorum signatures settle a batch without a Nitro proof.</desc>
<text x="32" y="126" font-size="15" font-weight="500" text-anchor="start" fill="var(--foreground-secondary, #666)">1 · PREPARE IN THE ZONE</text>
<rect x="32" y="148" width="260" height="212" rx="10" fill="var(--diagram-box, #f6f6f6)" stroke="var(--diagram-box-border, #d4d4d4)" stroke-width="1.5"/>
<g transform="translate(162 197)" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<path d="M-22 -10L0 -20L22 -10L0 0Z"/>
<path d="M-22 0L0 10L22 0"/>
<path d="M-22 10L0 20L22 10"/>
</g>
<text x="162" y="254" font-size="22" font-weight="600" text-anchor="middle" fill="currentColor">Zone sequencer</text>
<text x="162" y="296" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Group blocks into a batch</text>
<text x="162" y="322" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Gather the state witness</text>
<path d="M308 254 L334 254 M326.00 250.00 L334 254 L326.00 258.00" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="126" font-size="15" font-weight="500" text-anchor="start" fill="var(--foreground-secondary, #666)">2 · PROVE IN THE ZONE</text>
<rect x="350" y="148" width="260" height="212" rx="10" fill="var(--diagram-box, #f6f6f6)" stroke="var(--diagram-box-border, #d4d4d4)" stroke-width="1.5"/>
<g transform="translate(480 197)" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<rect x="-15" y="-15" width="30" height="30" rx="4"/>
<path d="M-8 -22v7 M0 -22v7 M8 -22v7 M-8 15v7 M0 15v7 M8 15v7 M-22 -8h7 M-22 0h7 M-22 8h7 M15 -8h7 M15 0h7 M15 8h7"/>
<path d="M-6 0l4 4 8-8"/>
</g>
<text x="480" y="254" font-size="22" font-weight="600" text-anchor="middle" fill="currentColor">Nitro prover</text>
<text x="480" y="296" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Replay in AWS Nitro</text>
<text x="480" y="322" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Sign an attestation</text>
<path d="M626 254 L652 254 M644.00 250.00 L652 254 L644.00 258.00" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="126" font-size="15" font-weight="500" text-anchor="start" fill="var(--foreground-secondary, #666)">3 · SETTLE ON TEMPO</text>
<rect x="668" y="148" width="260" height="212" rx="10" fill="var(--diagram-box, #f6f6f6)" stroke="var(--diagram-box-border, #d4d4d4)" stroke-width="1.5"/>
<g transform="translate(798 197)" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<rect x="-18" y="-3" width="36" height="28" rx="4"/>
<path d="M-11 -3v-11a11 11 0 0122 0v11 M0 8v7"/>
</g>
<text x="798" y="254" font-size="22" font-weight="600" text-anchor="middle" fill="currentColor">Zone portal</text>
<text x="798" y="296" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Verify signatures + proof</text>
<text x="798" y="322" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Record state, queue exits</text>
<rect x="32" y="392" width="896" height="76" rx="10" fill="var(--diagram-box, #f6f6f6)" stroke="var(--diagram-box-border, #d4d4d4)" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="56" y="424" font-size="17" font-weight="600" text-anchor="start" fill="currentColor">T13 fallback · NoProof</text>
<text x="56" y="450" font-size="16" font-weight="400" text-anchor="start" fill="var(--foreground-secondary, #666)">Quorum signatures can settle a batch without a Nitro proof. A later upgrade removes this path.</text>
</svg>
