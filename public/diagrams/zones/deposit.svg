</g>
<text x="798" y="254" font-size="22" font-weight="600" text-anchor="middle" fill="currentColor">Private account</text>
<text x="798" y="296" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Zone A imports the deposit</text>
<text x="798" y="322" font-size="16" font-weight="400" text-anchor="middle" fill="var(--foreground-secondary, #666)">Read the credited balance</text>
