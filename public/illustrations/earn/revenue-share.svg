<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 400 280" role="img" data-illustration="interface" aria-labelledby="title description"><title id="title">Share returns</title><desc id="description">Illustrative split of $100.00 in returns: 20%, or $20.00, to your business as a fee recipient and 80%, or $80.00, to your customers.</desc><g transform="translate(-40 -40)"><path d="M376 40 c30.17 0 45.255 0 54.627 9.373  c9.373 9.373 9.373 24.458 9.373 54.627 L440 256 c0 30.17 0 45.255 -9.373 54.627  c-9.373 9.373 -24.458 9.373 -54.627 9.373 L104 320 c-30.17 0 -45.255 0 -54.627 -9.373  c-9.373 -9.373 -9.373 -24.458 -9.373 -54.627 L40 104 c0 -30.17 0 -45.255 9.373 -54.627  c9.373 -9.373 24.458 -9.373 54.627 -9.373Z" fill="var(--tempo-art-surface, #F5F5F5)" stroke="none" stroke-width="1" vector-effect="non-scaling-stroke"/><text x="80" y="80" fill="var(--tempo-art-secondary, #707070)" font-family="Pilat" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">Share returns</text><text x="400" y="80" fill="var(--tempo-art-secondary, #707070)" font-family="Pilat" font-size="12" font-weight="400" text-anchor="end" letter-spacing="0">Illustrative</text><text x="80" y="118" fill="var(--tempo-art-secondary, #707070)" font-family="Pilat" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Returns to distribute</text><text x="400" y="118" fill="var(--tempo-art-ink, #000000)" font-family="Pilat" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">$100.00</text><defs><linearGradient id="earn-revenue-divider" gradientUnits="userSpaceOnUse" x1="80" y1="140" x2="400" y2="140"><stop offset="0" stop-color="var(--tempo-art-divider, #EBEBEB)" stop-opacity="0"/><stop offset=".2" stop-color="var(--tempo-art-divider, #EBEBEB)"/><stop offset=".8" stop-color="var(--tempo-art-divider, #EBEBEB)"/><stop offset="1" stop-color="var(--tempo-art-divider, #EBEBEB)" stop-opacity="0"/></linearGradient></defs><path d="M80 14