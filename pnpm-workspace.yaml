blockExoticSubdeps: false

ignoredBuiltDependencies:
  - protobufjs

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - accounts
  - mppx
  - incur
  - ox
  - viem
  - vocs
  - vite
  - tapimo
  - es-module-lexer
  - '@vocs/twoslash-rust'
  - '@vocs/twoslash-rust-darwin-arm64'
  - '@vocs/twoslash-rust-linux-x64-gnu'

onlyBuiltDependencies:
  - core-js
  - es5-ext
  - esbuild
  - vue-demi

overrides:
  'baseline-browser-mapping@<2.11.0': 2.11.0
  'browserslist@<4.28.7': 4.28.7
  dompurify: '>=3.4.0'
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'fflate@>=0.4.5 <0.4.9': 0.4.9
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  protobufjs: '>=7.5.5'
  # remark-mdx-frontmatter 5 still requests toml 3; toml 4 fixes its parser advisories.
  'remark-mdx-frontmatter@5>toml': 4.2.0
  tar: '>=7.5.13'

patchedDependencies:
  '@braintree/sanitize-url@7.1.2': patches/@braintree__sanitize-url@7.1.2.patch
  dayjs@1.11.20: patches/dayjs@1.11.20.patch
  vocs@2.8.5: patches/vocs@2.8.5.patch

strictDepBuilds: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - reselect@5.1.1
  - semver@6.3.1
